name: Update README metadata

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-metadata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Record manual update timestamp
        run: |
          date -u +"Last manually refreshed: %Y-%m-%d %H:%M UTC" > /tmp/readme-time
          grep -v "^Last manually refreshed:" README.md > /tmp/readme-body || true
          cat /tmp/readme-body > README.md
          printf "\n\n" >> README.md
          cat /tmp/readme-time >> README.md
      - name: Commit timestamp when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README metadata change."
            exit 0
          fi
          git commit -m "chore: refresh README metadata"
          git push
